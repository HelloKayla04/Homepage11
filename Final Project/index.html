<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DREAM DODGER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="game-container" class="glass-panel">
        
        <div id="hud">
            <span class="hud-text">SCORE</span>
            <span id="score" class="score-pill">00</span>
        </div>

        <div id="ui-overlay" class="menu-screen">
            <h1 class="title">DREAM<br>DODGER</h1>
            <p id="ui-message" class="subtitle">Keep it cute. Dodge the storm.</p>
            <button id="action-btn" class="pill-btn">PLAY NOW ✨</button>
        </div>

        <div id="player" class="hidden">🎀</div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
